<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Novella Mail">
  <defs>
    <linearGradient id="nm-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4d8fff"/>
      <stop offset="1" stop-color="#1f56d8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#nm-bg)"/>
