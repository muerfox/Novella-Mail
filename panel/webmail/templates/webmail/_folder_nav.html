<ul class="folder-list">
  {% for f in folders %}
    <li class="{% if f.name == current_folder %}active{% endif %}">
      <a href="{% url 'webmail:mail' %}?folder={{ f.name|urlencode }}">{{ f.name }}</a>
    </li>
  {% empty %}
    <li class="muted">No folders found.</li>
  {% endfor %}
</ul>
{% if quota %}
  <div class="quota-box">
    <div class="usage-bar{% if quota.percent >= 90 %} usage-high{% endif %}"><span style="width: {{ quota.percent }}%"></span></div>
    <p class="muted">{{ quota.used|filesizeformat }} of {{ quota.limit|filesizeformat }} used</p>
  </div>
{% endif %}
