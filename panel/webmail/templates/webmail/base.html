{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Novella Mail{% endblock %}</title>
  <link rel="icon" href="{% static 'webmail/img/favicon.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'webmail/img/favicon.ico' %}" sizes="any">
  <link rel="apple-touch-icon" href="{% static 'webmail/img/apple-touch-icon.png' %}">
  <link rel="stylesheet" href="{% static 'webmail/css/style.css' %}">
  <script src="{% static 'webmail/js/htmx.min.js' %}" defer></script>
  <script src="{% static 'webmail/js/app.js' %}" defer></script>
</head>
<body hx-boost="true" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
</body>
</html>
