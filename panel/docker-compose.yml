# Not meant to be run standalone (`docker compose -f panel/docker-compose.yml
# up` on its own would fail: mailcow-network is intentionally NOT declared
# here). Always bring this up via the root docker-compose.yml's `include:`,
# which merges this with mailcow-dockerized/docker-compose.yml into one
# project - that file is the sole owner of the mailcow-network definition
# (driver, IPAM, etc.); redeclaring it here too, even as an empty override,
# makes some Compose versions reject the merge as "conflicting network".
# Referencing it in the service below is enough once merged.
services:
  panel:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - panel_data:/app/data
    ports:
      - "127.0.0.1:${PANEL_PORT:-3007}:8000"
    networks:
      - default
      - mailcow-network

volumes:
  panel_data:
