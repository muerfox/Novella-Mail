services:
  panel:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - panel_data:/app/data
    ports:
      - "127.0.0.1:${PANEL_PORT:-3007}:8000"
    networks:
      - default
      - mailcow-network

volumes:
  panel_data:

networks:
  default:
  # mailcow-network is really defined by mailcow-dockerized/docker-compose.yml
  # (driver, IPAM, etc.) - this empty entry just lets this file validate and
  # attach to it on its own. When brought up together via the root
  # docker-compose.yml's `include:`, both files merge into one project and
  # this resolves to that same real network, so the panel can reach
  # mailcow's admin API container-to-container (see webmail/mailcow_api.py).
  # Standing this file up on its own (without the root include) will instead
  # create a fresh, empty "mailcow-network" with no mailcow containers on it.
  mailcow-network: {}
