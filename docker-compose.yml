# Single entry point: `docker compose up -d` from this directory brings up
# the whole stack (mail engine + panel) as one project. See docs/SETUP.md.
#
# Requires Docker Compose >= 2.20 for `include:` (part of any current Docker
# Engine install; check with `docker compose version`).
#
# env_file is explicit here rather than relying on each included file's own
# directory being auto-scanned for a .env - that auto-discovery is version-
# dependent, and running from the repo root (not each subdirectory) is
# exactly the case where it can silently miss both files.
name: novella-mail

include:
  - path: mailcow-dockerized/docker-compose.yml
    env_file: mailcow-dockerized/mailcow.conf
  - path: panel/docker-compose.yml
    env_file: panel/.env
